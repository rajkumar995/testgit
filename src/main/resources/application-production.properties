# =======================================================
# PRODUCTION CONFIGURATION
# =======================================================
# IMPORTANT: Update all values before deploying to production
# Use environment variables for sensitive data

spring.application.name=medidropbox
server.port=443

# =======================================================
# DATABASE CONFIGURATION - PRODUCTION
# =======================================================
# ✅ REQUIRED: Enable SSL for database connections
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://YOUR_DB_HOST:3306/YOUR_DB_NAME?useSSL=true&requireSSL=true&verifyServerCertificate=true&serverTimezone=UTC&autoReconnect=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Connection Pool
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# =======================================================
# HTTPS/SSL CONFIGURATION
# =======================================================
# ✅ REQUIRED: Configure SSL certificate
server.ssl.enabled=true
server.ssl.key-store=/path/to/keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=medidropbox

# Redirect HTTP to HTTPS
server.http.port=80

# =======================================================
# CORS CONFIGURATION - PRODUCTION
# =======================================================
# ✅ REQUIRED: Replace * with your actual frontend domains
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:https://app.medidropbox.com,https://admin.medidropbox.com}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# =======================================================
# ENCRYPTION CONFIGURATION
# =======================================================
# ✅ REQUIRED: Use strong password from environment variable
jasypt.encryptor.algorithm=PBEWITHHMACSHA512ANDAES_256
jasypt.encryptor.password=${ENCRYPTION_PASSWORD}
jasypt.encryptor.key-obtention-iterations=10000
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.RandomIvGenerator

# =======================================================
# SHARED BOOKING WEBPAGE URL (backend base URL)
# =======================================================
# Public URL of this backend (no trailing slash). Share URL = base + /shared/{token}. When JAR is hosted, set to your API URL.
app.share-view-base-url=${APP_PUBLIC_URL:https://api.medidropbox.com}
# App download link on shared booking page (Play Store / App Store / landing). Empty = button links to #
app.share.app-download-url=${APP_DOWNLOAD_URL:}

# =======================================================
# AWS S3 CONFIGURATION
# =======================================================
# ✅ REQUIRED: Use environment variables, never hardcode
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.base-url=https://${aws.s3.bucket-name}.s3.${aws.s3.region}.amazonaws.com

# =======================================================
# LOGGING CONFIGURATION - PRODUCTION
# =======================================================
logging.level.root=INFO
logging.level.com.medidropbox=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# Audit Logging
logging.logger.AUDIT_LOG.name=AUDIT_LOG
logging.logger.AUDIT_LOG.level=INFO
logging.logger.AUDIT_LOG.additivity=false

# =======================================================
# FILE UPLOAD CONFIGURATION
# =======================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# =======================================================
# SWAGGER/OPENAPI CONFIGURATION
# =======================================================
# Disable in production for security
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
