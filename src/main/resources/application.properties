
# =======================================================
# APPLICATION CONFIGURATION
# =======================================================
spring.application.name=medidropbox
server.port=8080

# Disable DevTools restart classloader (fixes "AwsS3Config.class does not exist" when class is present)
spring.devtools.restart.enabled=false

# =======================================================
# DATABASE CONFIGURATION
# =======================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Database URL - Updated for better connection handling
# For development: useSSL=false or verifyServerCertificate=false
# For production: useSSL=true&requireSSL=true&verifyServerCertificate=true
spring.datasource.url=jdbc:mysql://mysql.gb.stackcp.com:41153/Smartbecho-3530343779fe?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&autoReconnect=true&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=2&connectTimeout=60000&socketTimeout=60000
spring.datasource.username=rajaram
spring.datasource.password=Smartbecho@


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Updated to use MySQLDialect (MySQL8Dialect is deprecated)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.transaction.coordinator_class=jdbc

# Connection Pool - Enhanced for better connection handling
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=false
# Keep connections alive (helps after long idle/sleep); reduces "clock leap" style warnings
spring.datasource.hikari.keepalive-time=30000
# Additional connection retry settings
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-init-sql=SELECT 1

# =======================================================
# JPA AUDITING
# =======================================================
spring.data.jpa.repositories.enabled=true

# =======================================================
# LOGGING CONFIGURATION
# =======================================================
logging.level.root=INFO
logging.level.com.medidropbox=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
# Suppress HikariCP "Thread starvation or clock leap detected" WARN (e.g. after sleep/hibernate or NTP)
logging.level.com.zaxxer.hikari.pool.HikariPool=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =======================================================
# SWAGGER/OPENAPI CONFIGURATION
# =======================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# =======================================================
# CORS CONFIGURATION
# =======================================================
# Allow all origins (use * for development, specific domains for production)
spring.web.cors.allowed-origins=*
# Allow all HTTP methods
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
# Allow all headers
spring.web.cors.allowed-headers=*
# Allow credentials (cookies, authorization headers)
spring.web.cors.allow-credentials=true
# Cache preflight requests for 1 hour
spring.web.cors.max-age=3600

# =======================================================
# FILE UPLOAD CONFIGURATION
# =======================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
# File upload security: validate file types and sizes
file.upload.allowed-types=image/jpeg,image/jpg,image/png,image/gif,image/bmp,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
file.upload.max-size-mb=10

# =======================================================
# FILE COMPRESSION CONFIGURATION
# =======================================================
# Minimum file size to compress (files smaller than this won't be compressed)
# Set to 0 to compress all files regardless of size
file.compression.min-size-mb=0
# Maximum file size before compression (files larger than this will be rejected)
file.compression.max-size-mb=10
# Compression level (0-9, where 9 is maximum compression, 6 is balanced)
# For images and PDFs, use level 6-7 for good balance between size and speed
file.compression.level=6
# Enable compression for images (JPEG, PNG, GIF) - they can still benefit from compression
file.compression.compress-images=true
# Enable compression for PDFs - PDFs can benefit from additional compression
file.compression.compress-pdfs=true

# =======================================================
# JACKSON (UTC Date Handling)
# =======================================================
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# =======================================================
# RATE LIMITING
# =======================================================
# Configured in RateLimitingConfig.java

# =======================================================
# AWS S3 CONFIGURATION
# =======================================================
# AWS S3 bucket for hospital images, patient profile images, and lab reports
# Note: Using shopdata2 bucket with organized folder structure:
#   - hospital/ - Hospital images
#   - patient/ - Patient profile images
#   - reports/ - Lab reports (organized by type and patient ID)
aws.s3.bucket-name=shopdata2
aws.s3.region=ap-south-1

aws.s3.access-key=${aws_access_key}
aws.s3.secret-key=${aws_secret_key}
aws.s3.base-url=https://${aws.s3.bucket-name}.s3.${aws.s3.region}.amazonaws.com

# =======================================================
# SHARED BOOKING WEBPAGE URL (for share response)
# =======================================================
# Base URL of this backend (no trailing slash). Share URL = base + /shared/{token}. When JAR is hosted, set to public URL.
# e.g. http://localhost:8080 or https://api.yourapp.com
app.share-view-base-url=http://localhost:8080
# App download link shown on shared booking page (Play Store / App Store / landing). Empty = hide or use #
app.share.app-download-url=

# =======================================================
# SCHEDULED JOBS
# =======================================================
# Auto-resolve pending bookings (past days): AUTO_CANCEL / CARRY_OVER per hospital setting
app.scheduler.pending-bookings.enabled=true
# Cron: default 0 0 0 * * ? = midnight every day (server timezone)
app.scheduler.pending-bookings.cron=0 0 0 * * ?

# =======================================================
# MSG91 OTP Widget API v5 (send notification and verify)
# =======================================================
# Auth key from MSG91 dashboard. Required for all OTP operations.
# Set here or via env: MSG91_AUTH_KEY
msg91.auth-key=${MSG91_AUTH_KEY:487538AuWT6M7FbzGZ696365aeP1}
# Widget ID from MSG91 dashboard (Widget API v5). Required for all OTP operations.
# Set here or via env: MSG91_WIDGET_ID
msg91.widget-id=${MSG91_WIDGET_ID:36616b684e6d383632343333}
# Base URL for MSG91 Widget API. Optional; default: https://api.msg91.com/api/v5/widget
# Used to build: {base-url}/sendOtp, /verifyOtp, /verifyAccessToken, /retryOtp
msg91.base-url=${MSG91_BASE_URL:https://api.msg91.com/api/v5/widget}


# =======================================================
# ENCRYPTION CONFIGURATION
# =======================================================
# Upgraded to AES-256 for HIPAA/GDPR compliance
jasypt.encryptor.algorithm=PBEWITHHMACSHA512ANDAES_256
jasypt.encryptor.password=${ENCRYPTION_PASSWORD:medidropbox-secret-key-change-in-production}
jasypt.encryptor.key-obtention-iterations=10000
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.RandomIvGenerator
